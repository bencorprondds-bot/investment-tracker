[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthfolio"
version = "0.1.0"
description = "A lightweight personal investment tracker"
authors = [
  { name = "Auto Generated" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://example.com/wealthfolio"

[project.scripts]
wealthfolio = "wealthfolio.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra"
testpaths = [
  "tests"
]
